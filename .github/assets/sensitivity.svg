<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img" aria-label="Mnemosyne sensitivity tiers: public, internal, confidential, restricted, enforced by a numeric ceiling">
  <title>Sensitivity Tiers — numeric ceiling</title>
  <desc>Four tiers ordered by a numeric ceiling: public (0), internal (1), confidential (2), restricted (3). An agent reads at or below its ceiling; reads above it return 404, not 403.</desc>

  <defs>
    <linearGradient id="axis" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#1210b0"/>
      <stop offset="33%"  stop-color="#1a18f0"/>
      <stop offset="66%"  stop-color="#a35a00"/>
      <stop offset="100%" stop-color="#b4231b"/>
    </linearGradient>
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.32"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="gridP" x="0" y="0" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#c9c6ee" stroke-width="0.5" stroke-opacity="0.45"/>
    </pattern>
    <marker id="axHead" viewBox="0 0 10 10" refX="5" refY="9" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 5 9 L 10 0 z" fill="#b4231b"/>
    </marker>
    <style><![CDATA[
      @keyframes m-pulse {
        0%, 100% { opacity: 0.55; transform: scale(1); }
        50%      { opacity: 1;    transform: scale(1.22); }
      }
      @keyframes m-ring {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50%      { opacity: 0.85; transform: scale(1.15); }
      }
      /* the numbered tier badges glow */
      @keyframes m-badge {
        0%, 100% { opacity: 0.80; }
        50%      { opacity: 1.00; }
      }
      /* the sensitivity axis flows downward toward the ceiling arrow */
      @keyframes m-flow {
        from { stroke-dashoffset: 24; }
        to   { stroke-dashoffset: 0; }
      }
      circle[r="5"], circle[r="9"] {
        transform-origin: center; transform-box: fill-box;
      }
      circle[r="5"]  { animation: m-pulse 2.8s ease-in-out infinite; }
      circle[r="9"]  { animation: m-ring  3.4s ease-in-out infinite; }
      circle[r="19"] { animation: m-badge 2.4s ease-in-out infinite; }
      /* badges light up top→bottom: the ceiling visibly rises 0→1→2→3 */
      g:nth-of-type(2) > circle[r="19"] { animation-delay: 0.5s; }
      g:nth-of-type(3) > circle[r="19"] { animation-delay: 1.0s; }
      g:nth-of-type(4) > circle[r="19"] { animation-delay: 1.5s; }
      line[marker-end] { stroke-dasharray: 5 5; animation: m-flow 1.8s linear infinite; }
      @media (prefers-reduced-motion: reduce) {
        circle[r="5"], circle[r="9"], circle[r="19"] { animation: none; }
        line[marker-end] { stroke-dasharray: none; animation: none; }
      }
    ]]></style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="440" fill="#fcfbf8"/>
  <rect width="1200" height="440" fill="url(#gridP)"/>
  <rect x="24" y="24" width="1152" height="392" rx="0" fill="none" stroke="#c9c6ee" stroke-width="1" stroke-opacity="0.7"/>

  <!-- Left axis: least → most sensitive -->
  <line x1="74" y1="58" x2="74" y2="346" stroke="url(#axis)" stroke-width="3" marker-end="url(#axHead)"/>
  <text x="58" y="200" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="700" letter-spacing="0.16em" fill="#4b4a72" transform="rotate(-90 58 200)" text-anchor="middle">SENSITIVITY  RISES  →  CEILING</text>

  <!-- public -->
  <g transform="translate(120, 56)">
    <rect width="980" height="62" rx="0" fill="#f5ecde" stroke="#1210b0" stroke-width="1.2" stroke-opacity="0.65"/>
    <circle cx="42" cy="31" r="19" fill="#1210b0" fill-opacity="0.14" stroke="#1210b0" stroke-width="1.3"/>
    <text x="42" y="37" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="700" fill="#1210b0">0</text>
    <text x="80" y="29" font-family="Inter, ui-sans-serif, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#0b0a2e">public</text>
    <text x="80" y="49" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#4b4a72">every credential in the workspace can read it</text>
    <circle cx="958" cy="31" r="5" fill="#1210b0"/>
    <circle cx="958" cy="31" r="9" fill="none" stroke="#1210b0" stroke-width="0.8" opacity="0.55"/>
  </g>

  <!-- internal -->
  <g transform="translate(120, 134)">
    <rect width="980" height="62" rx="0" fill="#f5ecde" stroke="#1a18f0" stroke-width="1.2" stroke-opacity="0.65"/>
    <circle cx="42" cy="31" r="19" fill="#1a18f0" fill-opacity="0.14" stroke="#1a18f0" stroke-width="1.3"/>
    <text x="42" y="37" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="700" fill="#1a18f0">1</text>
    <text x="80" y="29" font-family="Inter, ui-sans-serif, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#0b0a2e">internal</text>
    <text x="80" y="49" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#4b4a72">workspace members only — the default for a new memory</text>
    <circle cx="958" cy="31" r="5" fill="#1a18f0"/>
    <circle cx="958" cy="31" r="9" fill="none" stroke="#1a18f0" stroke-width="0.8" opacity="0.55"/>
  </g>

  <!-- confidential -->
  <g transform="translate(120, 212)">
    <rect width="980" height="62" rx="0" fill="#f5ecde" stroke="#a35a00" stroke-width="1.2" stroke-opacity="0.65"/>
    <circle cx="42" cy="31" r="19" fill="#a35a00" fill-opacity="0.14" stroke="#a35a00" stroke-width="1.3"/>
    <text x="42" y="37" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="700" fill="#a35a00">2</text>
    <text x="80" y="29" font-family="Inter, ui-sans-serif, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#0b0a2e">confidential</text>
    <text x="80" y="49" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#4b4a72">needs a credential whose ceiling is confidential or higher</text>
    <circle cx="958" cy="31" r="5" fill="#a35a00"/>
    <circle cx="958" cy="31" r="9" fill="none" stroke="#a35a00" stroke-width="0.8" opacity="0.55"/>
  </g>

  <!-- restricted -->
  <g transform="translate(120, 290)">
    <rect width="980" height="62" rx="0" fill="#f5ecde" stroke="#b4231b" stroke-width="1.2" stroke-opacity="0.7"/>
    <circle cx="42" cy="31" r="19" fill="#b4231b" fill-opacity="0.14" stroke="#b4231b" stroke-width="1.3"/>
    <text x="42" y="37" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="700" fill="#b4231b">3</text>
    <text x="80" y="29" font-family="Inter, ui-sans-serif, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#0b0a2e">restricted</text>
    <text x="80" y="49" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#4b4a72">only credentials with the highest ceiling</text>
    <circle cx="958" cy="31" r="5" fill="#b4231b"/>
    <circle cx="958" cy="31" r="9" fill="none" stroke="#b4231b" stroke-width="0.8" opacity="0.55"/>
  </g>

  <!-- Caption -->
  <text x="120" y="388" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#4b4a72">Ceiling is a numeric compare (<tspan fill="#4b4a72">SENSITIVITY_ORDER</tspan>), never string equality · over-ceiling reads return <tspan fill="#b4231b" font-weight="700">404</tspan>, not 403 (anti-probing).</text>
</svg>

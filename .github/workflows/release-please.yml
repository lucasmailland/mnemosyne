# release-please — automates SemVer + CHANGELOG.md from Conventional Commits.
#
# How it works:
#   1. On every push to main, the action scans commit messages since the last
#      release tag and computes the next version (feat → minor, fix → patch,
#      BREAKING CHANGE → major; pre-1.0 keeps minor for breaking changes).
#   2. It opens a "Release PR" with the proposed version bump, an updated
#      CHANGELOG.md, and an updated .release-please-manifest.json. The PR
#      accumulates changes until a maintainer merges it.
#   3. On merge, the action tags `vX.Y.Z` and creates a GitHub Release with
#      auto-generated notes. The `docker-publish.yml` workflow then picks
#      up the tag and publishes the multi-arch image set to GHCR.
#
# Security notes:
#   - The `${{ ... }}` interpolations used by `googleapis/release-please-action`
#     read GitHub-controlled values only (the auto-issued GITHUB_TOKEN under
#     the hood). We never echo or run untrusted inputs (PR titles, commit
#     messages, issue bodies) inside `run:` blocks.
#
# Config: .github/release-please-config.json + .github/.release-please-manifest.json
name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        id: rp
        with:
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json

      # Self-heal: release-please's root-component release creation is unreliable
      # in this monorepo (the grouped release branch has no component in its name,
      # so the action logs "PR component: undefined does not match configured
      # component: mnemosyne" and skips the root GitHub release). If the manifest's
      # root version has no tag after the action runs, cut the release here.
      # Idempotent: no-ops whenever the tag already exists. Only GitHub-controlled
      # values (GITHUB_SHA, github.token, action outputs) are interpolated — no
      # user-controlled event fields reach run: blocks.
      - name: Checkout (for manifest read)
        if: ${{ steps.rp.outputs.releases_created != 'true' }}
        uses: actions/checkout@v7

      - name: Ensure root release exists (fallback)
        if: ${{ steps.rp.outputs.releases_created != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(jq -r '."."' .github/.release-please-manifest.json)
          TAG="v${VER}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists — nothing to do."
            exit 0
          fi
          echo "Release $TAG missing — creating it at $GITHUB_SHA."
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes

name: Chaos Engineering

# Spec §35 lines 4136–4194
# Runs weekly against staging. Requires MNEMO_CHAOS_ENABLED=true.
# Secrets required: STAGING_DATABASE_URL, STAGING_REDIS_URL (see docs/ops/ci-secrets.md)

on:
  schedule:
    # Every Tuesday at 02:00 UTC (low-traffic window)
    - cron: "0 2 * * 2"
  workflow_dispatch:
    inputs:
      experiment:
        description: "Specific experiment to run (leave empty for all)"
        required: false
        type: choice
        options:
          - ""
          - redis_partition
          - pg_replica_lag
          - embedding_provider_timeout
          - hot_tier_eviction
          - session_collapse_llm_failure
          - clock_skew
      environment:
        description: "Target environment"
        required: true
        default: "staging"
        type: choice
        options:
          - staging

jobs:
  chaos-unit:
    name: Chaos unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run chaos unit tests
        run: pnpm --filter @mnemo-ai/server exec vitest run src/chaos/__tests__/chaos.test.ts
        env:
          # Unit tests run with enabled=false — no real infra needed
          MNEMO_CHAOS_ENABLED: "false"

  chaos-staging:
    name: Chaos experiments (staging)
    runs-on: ubuntu-latest
    # Only run against staging — never production
    environment: staging
    needs: chaos-unit
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build server
        run: pnpm --filter @mnemo-ai/server build

      - name: Run chaos experiments against staging
        env:
          MNEMO_CHAOS_ENABLED: "true"
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          REDIS_URL: ${{ secrets.STAGING_REDIS_URL }}
          NODE_ENV: "staging"
          # Safe: choices are restricted to an allow-list via the workflow_dispatch inputs enum
          CHAOS_EXPERIMENT: ${{ github.event.inputs.experiment }}
        run: |
          echo "Running Mnemosyne chaos experiments against staging"
          echo "Experiment filter: ${CHAOS_EXPERIMENT:-all}"
          pnpm --filter @mnemo-ai/server exec node --experimental-vm-modules dist/chaos/run-chaos.js \
            --experiment="${CHAOS_EXPERIMENT}" \
            --report="chaos-report-$(date +%Y%m%d-%H%M%S).json"

      - name: Upload chaos report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: chaos-report-${{ github.run_id }}
          path: "packages/server/chaos-report-*.json"
          retention-days: 30

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Chaos experiment failed — check the report artifact and runbook at docs/ops/runbooks/chaos-runbook.md"

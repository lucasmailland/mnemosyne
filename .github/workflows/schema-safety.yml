name: Schema Migration Safety

on:
  pull_request:
    paths:
      - "packages/adapter-postgres/migrations/**"
      - "packages/adapter-postgres/src/migration-safety.ts"
      - "packages/adapter-postgres/src/migrate.ts"

jobs:
  lint:
    name: Lint migration safety
    runs-on: ubuntu-latest
    env:
      BASE_REF: ${{ github.base_ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build @mnemo-ai/types
        run: pnpm --filter @mnemo-ai/types build

      - name: Build @mnemo-ai/core
        run: pnpm --filter @mnemo-ai/core build

      - name: Build @mnemo-ai/adapter-postgres
        run: pnpm --filter @mnemo-ai/adapter-postgres build

      - name: Lint new migration files
        run: |
          ADDED=$(git diff --name-only --diff-filter=A origin/$BASE_REF...HEAD \
            | grep 'migrations/' || true)
          if [ -z "$ADDED" ]; then
            echo "No new migration files."
            exit 0
          fi
          echo "$ADDED" | while IFS= read -r f; do
            node scripts/lint-migrations.mjs "$f"
          done

      - name: Lint ALL committed baseline migrations (per-file)
        run: |
          FILES=$(find packages/adapter-postgres/migrations -name '*.sql' | sort)
          node scripts/lint-migrations.mjs --per-file $FILES

  shadow-apply:
    name: Shadow-DB apply
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mnemo_shadow
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build @mnemo-ai/types
        run: pnpm --filter @mnemo-ai/types build

      - name: Build @mnemo-ai/core
        run: pnpm --filter @mnemo-ai/core build

      - name: Build @mnemo-ai/adapter-postgres
        run: pnpm --filter @mnemo-ai/adapter-postgres build

      - name: Apply all migrations to shadow DB
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mnemo_shadow
        run: node packages/adapter-postgres/dist/migrate.js

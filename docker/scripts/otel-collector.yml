# OpenTelemetry Collector configuration for Mnemosyne.
# Receives OTLP spans/metrics from the server, exports to:
#   - Prometheus (metrics scrape endpoint)
#   - Tempo (distributed traces via OTLP gRPC)

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    limit_mib: 256
    check_interval: 5s

  batch:
    timeout: 5s
    send_batch_size: 512

  filter/drop_health:
    error_mode: ignore
    traces:
      span:
        - attributes["http.route"] == "/health"
        - attributes["http.route"] == "/healthz"
        - attributes["http.route"] == "/readyz"

  transform/pii_drop:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          - delete_key(attributes, "http.request.body")
          - delete_key(attributes, "http.response.body")
          - delete_key(attributes, "db.statement")
          - delete_key(attributes, "exception.message")
          - delete_key(attributes, "exception.stacktrace")
          - delete_key(attributes, "url.query")
          - delete_key(attributes, "http.url")

  tail_sampling:
    decision_wait: 10s
    num_traces: 50000
    expected_new_traces_per_sec: 200
    policies:
      - name: always_sample_errors
        type: status_code
        status_code:
          status_codes: [ERROR]
      - name: always_sample_slow
        type: latency
        latency:
          threshold_ms: 500
      - name: probabilistic_10pct
        type: probabilistic
        probabilistic:
          sampling_percentage: 10

exporters:
  prometheus:
    endpoint: 0.0.0.0:8888
    namespace: mnemosyne
    enable_open_metrics: true

  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

service:
  # The prometheus exporter above serves on 8888, the port the collector's own
  # metrics take by default; two listeners on one port stop the collector.
  telemetry:
    metrics:
      level: none
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, filter/drop_health, transform/pii_drop, tail_sampling, batch]
      exporters: [otlp/tempo]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
